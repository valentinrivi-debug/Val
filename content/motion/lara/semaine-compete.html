<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Lara · Semaine de compète</title></head>
<body><div id="stage"></div>
<script src="../common.js"></script>
<script>
// Voix (≈ 6 s) : « La semaine de la compète, on enlève des séries, mais on garde l'intensité.
// Si on allège trop, Lara se déconditionne. »
const rows = [
  ["LUNDI", "2×2 + 3×2", "1×2 + 3×2"],
  ["MERCREDI", "4×4", "3×4"],
  ["JEUDI", "2×1 + 2×3", "1×1 + 2×3"],
  ["FIN DE SEMAINE", "1 + 5×2", "COMPÈTE"],
];
const fns = [MF.header("SEMAINE 4", "LA COMPÈTE", 1.0)];
fns.push(MF.text("S3", "tag", { left: "470px", top: "440px", fontSize: "28px", color: "var(--g)" }, 1.0));
fns.push(MF.text("S4", "tag", { left: "760px", top: "440px", fontSize: "28px", color: "var(--y)" }, 1.0));
rows.forEach((r, i) => {
  const y = 500 + i * 100, t0 = 1.1 + i * .35;
  fns.push(MF.text(r[0], "txt", { left: "80px", top: y + "px", fontSize: "32px", color: "var(--g)" }, t0));
  const old = MF.el("txt", r[1], { left: "470px", top: y + "px", fontSize: "34px", color: "var(--c)" });
  const bar = MF.el("", "", { left: "466px", top: (y + 22) + "px", height: "4px", width: "0px", background: "var(--y)" });
  fns.push(t => {
    const p = MF.easeOut(MF.prog(t, t0, .3)); old.style.opacity = p;
    const s = MF.easeOut(MF.prog(t, t0 + .5, .3)); bar.style.width = (old.offsetWidth + 8) * s + "px";
    old.style.color = s > .5 ? "var(--d)" : "var(--c)";
  });
  fns.push(MF.text("→", "txt", { left: "700px", top: y + "px", fontSize: "34px", color: "var(--g)" }, t0 + .6));
  fns.push(MF.text(r[2], "txt", { left: "760px", top: y + "px", fontSize: "34px", color: i === 3 ? "var(--y)" : "var(--c)" }, t0 + .7));
});
fns.push(MF.text("− DE SÉRIES", "big", { left: "80px", top: "930px", fontSize: "110px", color: "var(--c)" }, 2.9));
fns.push(MF.text("MÊME INTENSITÉ", "big", { left: "80px", top: "1040px", fontSize: "110px", color: "var(--y)" }, 3.3));
fns.push(MF.text("TROP LÉGER = DÉCONDITIONNÉE", "tag", { left: "80px", top: "1170px", fontSize: "30px", color: "var(--g)" }, 4.4));
MF.run(fns);
</script></body></html>
