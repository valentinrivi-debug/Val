<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Lara · Intro</title></head>
<body><div id="stage"></div>
<script src="../common.js"></script>
<script>
// Voix (≈ 13 s) : « Quand Lara a commencé avec moi, elle faisait 80 kilos au bench. Ce week-end, en moins
// de 57 kilos, elle en a validé 95. Voilà comment on l'a préparée. Son point faible : pendant la pause,
// elle s'enfonce et elle perd sa tension. Toute sa semaine est construite autour de ça. »
const fns = [];
fns.push(MF.text("LARA · −57 KG OPEN", "lbl", { left: "80px", top: "140px" }, 0, 7.0));
// Compteur 80 → 95
const num = MF.el("big", "80 KG", { left: "80px", top: "220px", fontSize: "300px", color: "var(--c)" });
const plus = MF.el("big", "+15 KG", { left: "80px", top: "540px", fontSize: "120px", color: "var(--y)" });
const start = MF.el("txt", "AU DÉBUT DU SUIVI", { left: "80px", top: "540px", color: "var(--g)" });
fns.push(t => {
  const a = MF.easeOut(MF.prog(t, .3, .4)) * (1 - MF.prog(t, 7.0, .3));
  num.style.opacity = a;
  const c = MF.easeInOut(MF.prog(t, 4.0, 1.2));
  num.textContent = Math.round(80 + 15 * c) + " KG";
  num.style.color = c > .99 ? "var(--y)" : "var(--c)";
  start.style.opacity = MF.easeOut(MF.prog(t, .8, .3)) * (1 - MF.prog(t, 3.8, .3));
  plus.style.opacity = MF.easeOut(MF.prog(t, 5.3, .3)) * (1 - MF.prog(t, 7.0, .3));
});
// Point faible : la barre s'enfonce, la tension chute
fns.push(MF.text("POINT FAIBLE", "lbl", { left: "80px", top: "140px" }, 7.3));
fns.push(MF.text("LA PAUSE", "ttl", { left: "80px", top: "195px" }, 7.4));
const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
svg.setAttribute("class", "abs"); svg.setAttribute("width", 1080); svg.setAttribute("height", 1920);
svg.style.left = 0; svg.style.top = 0;
svg.innerHTML = `
  <path id="chest" d="M230 760 Q540 760 850 760" stroke="#FAF4E6" stroke-width="6" fill="none" stroke-linecap="round"/>
  <g id="bar"><line x1="200" y1="0" x2="880" y2="0" stroke="#FAF4E6" stroke-width="16" stroke-linecap="round"/>
    <rect x="170" y="-75" width="44" height="150" rx="10" fill="#FAF4E6"/><rect x="866" y="-75" width="44" height="150" rx="10" fill="#FAF4E6"/></g>
  <g transform="translate(990 500)">
    <rect x="-22" y="0" width="44" height="300" rx="8" fill="#2A2A2A"/>
    <rect id="gauge" x="-22" y="0" width="44" height="300" rx="8" fill="#FFDE32"/>
    <text x="0" y="345" text-anchor="middle" font-family="InterB" font-size="26" fill="#8A8A8A">TENSION</text>
  </g>`;
MF.stage.appendChild(svg);
const lost = MF.el("tag", "PERTE DE TENSION", { left: "540px", top: "880px", fontSize: "40px", transform: "translateX(-50%)" });
const sink = MF.el("txt", "elle s'enfonce", { left: "540px", top: "940px", color: "var(--g)", transform: "translateX(-50%)" });
const week = MF.el("big", "→ TOUTE SA SEMAINE CIBLE ÇA", { left: "80px", top: "1060px", fontSize: "70px", color: "var(--c)" });
fns.push(t => {
  const vis = MF.easeOut(MF.prog(t, 7.6, .3));
  svg.style.opacity = vis;
  const down = MF.easeOut(MF.prog(t, 7.8, .7));            // la barre arrive sur la poitrine
  const dip = MF.easeInOut(MF.prog(t, 8.8, 1.2));           // elle s'enfonce
  const y = 380 + 368 * down + 50 * dip;
  svg.querySelector("#bar").setAttribute("transform", `translate(0 ${y})`);
  svg.querySelector("#chest").setAttribute("d", `M230 ${760 + 50 * dip} L850 ${760 + 50 * dip}`);
  const g = 1 - .75 * dip;
  const gauge = svg.querySelector("#gauge");
  gauge.setAttribute("height", 300 * g); gauge.setAttribute("y", 300 * (1 - g));
  lost.style.opacity = MF.easeOut(MF.prog(t, 9.4, .3));
  sink.style.opacity = MF.easeOut(MF.prog(t, 9.0, .3));
  week.style.opacity = MF.easeOut(MF.prog(t, 11.2, .3));
});
MF.run(fns);
</script></body></html>
